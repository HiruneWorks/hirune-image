services:
  image:
    image: hirune-image:local
    build:
      context: ..
      dockerfile: compose/production/app/Dockerfile
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m,mode=1777
    environment:
      HIRUNE_CONCURRENCY: "1"
    networks: [processing]
    restart: unless-stopped
networks:
  processing:
    internal: true
