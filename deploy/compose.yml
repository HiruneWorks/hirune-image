services:
  image:
    image: ${HIRUNE_IMAGE:-ghcr.io/hiruneworks/hirune-image:0.2.0}
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${HIRUNE_CONTAINER_MEMORY:-1g}
    cpus: ${HIRUNE_CONTAINER_CPUS:-2}
    pids_limit: ${HIRUNE_CONTAINER_PIDS:-64}
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=${HIRUNE_TMPFS_SIZE:-512m},mode=1777
    environment:
      HIRUNE_CONCURRENCY: ${HIRUNE_CONCURRENCY:-1}
      HIRUNE_SOURCE_BYTES: ${HIRUNE_SOURCE_BYTES:-33554432}
      HIRUNE_REQUEST_BYTES: ${HIRUNE_REQUEST_BYTES:-34603008}
      HIRUNE_RECIPE_BYTES: ${HIRUNE_RECIPE_BYTES:-16384}
      HIRUNE_INPUT_DIMENSION: ${HIRUNE_INPUT_DIMENSION:-8192}
      HIRUNE_CANVAS_PIXELS: ${HIRUNE_CANVAS_PIXELS:-40000000}
      HIRUNE_FRAMES: ${HIRUNE_FRAMES:-120}
      HIRUNE_TOTAL_FRAME_PIXELS: ${HIRUNE_TOTAL_FRAME_PIXELS:-100000000}
      HIRUNE_DECODED_BYTES: ${HIRUNE_DECODED_BYTES:-268435456}
      HIRUNE_WORKING_BYTES: ${HIRUNE_WORKING_BYTES:-268435456}
      HIRUNE_SPOOL_BYTES: ${HIRUNE_SPOOL_BYTES:-268435456}
      HIRUNE_DURATION_MS: ${HIRUNE_DURATION_MS:-60000}
      HIRUNE_OUTPUTS: ${HIRUNE_OUTPUTS:-4}
      HIRUNE_OUTPUT_BYTES: ${HIRUNE_OUTPUT_BYTES:-33554432}
      HIRUNE_OUTPUT_DIMENSION: ${HIRUNE_OUTPUT_DIMENSION:-4096}
      HIRUNE_DEADLINE_MS: ${HIRUNE_DEADLINE_MS:-60000}
      HIRUNE_IDLE_MS: ${HIRUNE_IDLE_MS:-10000}
      HIRUNE_CHILD_MEMORY_BYTES: ${HIRUNE_CHILD_MEMORY_BYTES:-805306368}
      HIRUNE_CHILD_CPU_SECONDS: ${HIRUNE_CHILD_CPU_SECONDS:-60}
    networks: [processing]
    restart: unless-stopped
networks:
  processing:
    internal: true
