[package]
name = "hirune-image"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "hirune_image"

[workspace]
resolver = "3"
members = ["crates/application", "crates/image-codec", "xtask"]

[workspace.package]
authors = ["Levi Laine"]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.98"

[workspace.dependencies]
application = { path = "crates/application" }
image-codec = { path = "crates/image-codec" }
anyhow = "1.0.104"
thiserror = "2.0.20"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
schemars = "1.2.1"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "process", "fs", "io-util"] }
tokio-util = { version = "0.7.19", features = ["rt", "io"] }
axum = { version = "0.8.9", features = ["macros"] }
multer = "3.1.0"
bytes = "1.11.1"
socket2 = "0.6.5"
futures-util = "0.3.32"
http-body = "1.0.1"
http-body-util = "0.1.3"
uuid = { version = "1.26.1", features = ["v7", "serde"] }
tempfile = "3.27.0"
sha2 = "0.11.0"
hex = "0.4.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
image = { version = "=0.25.10", default-features = false, features = ["gif", "png", "jpeg"] }
gif = "=0.14.2"
libwebp-sys2 = { version = "=0.2.0", features = ["static", "demux", "mux", "1_5"] }
moxcms = "=0.9.1"
libc = "0.2.186"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "stream", "rustls"] }

[dependencies]
sha2.workspace = true
application.workspace = true
image-codec.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
tokio.workspace = true
tokio-util.workspace = true
axum.workspace = true
multer.workspace = true
bytes.workspace = true
socket2.workspace = true
futures-util.workspace = true
http-body.workspace = true
http-body-util.workspace = true
uuid.workspace = true
tempfile.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
jsonschema = { version = "0.37.1", default-features = false }
png = "0.18.1"
crc32fast = "1.5.0"
reqwest.workspace = true
image.workspace = true
gif.workspace = true
sha2.workspace = true
hex.workspace = true

[[bin]]
name = "resource_test_worker"
path = "tests/support/resource_worker.rs"
test = false
doc = false

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
strip = "debuginfo"
